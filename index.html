<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ES6 Assignment Programs</title>
  <style>
    :root { --ink: #182230; --muted: #687386; --paper: #f7f4ee; --panel: #fffdf9; --line: #e4ded3; --accent: #d65a3a; --navy: #223044; }
    * { box-sizing: border-box; }
    body { max-width: 1120px; margin: 0 auto; padding: 48px 24px; font-family: Georgia, "Times New Roman", serif; color: var(--ink); background: var(--paper); }
    .topbar { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 34px; border-bottom: 1px solid var(--line); padding-bottom: 24px; }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font: 700 12px/1.2 Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; max-width: 600px; font-size: clamp(32px, 5vw, 58px); line-height: .98; }
    .intro { max-width: 310px; margin: 0; color: var(--muted); font: 15px/1.6 Arial, sans-serif; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(280px, .75fr); gap: 22px; align-items: start; }
    .programs, .result-panel { border: 1px solid var(--line); background: var(--panel); }
    .programs { padding: 22px; }
    .section-label { margin: 0 0 16px; color: var(--muted); font: 700 11px/1.2 Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    .buttons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    button { display: flex; align-items: center; min-height: 68px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink); background: #fff; font: 600 14px/1.25 Arial, sans-serif; text-align: left; cursor: pointer; transition: border-color 160ms ease, background 160ms ease, transform 160ms ease; }
    button:hover, button:focus-visible { border-color: var(--accent); background: #fff7f2; outline: none; transform: translateY(-2px); }
    .result-panel { position: sticky; top: 24px; overflow: hidden; }
    .result-heading { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--line); background: var(--navy); color: #fff; font: 700 12px/1.2 Arial, sans-serif; letter-spacing: .1em; text-transform: uppercase; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #f1a45f; }
    pre { min-height: 290px; margin: 0; padding: 22px 20px; white-space: pre-wrap; color: #d7e2e8; background: #182230; font: 14px/1.7 Consolas, "Courier New", monospace; }
    @media (max-width: 760px) { body { padding: 28px 16px; } .topbar { display: block; } .intro { margin-top: 18px; } .workspace { grid-template-columns: 1fr; } .result-panel { position: static; } }
    @media (max-width: 480px) { .buttons { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">JavaScript / Practical Lab</p>
      <h1>ES6 Assignment<br>Workbench</h1>
    </div>
    <p class="intro">Eight focused exercises covering modern JavaScript syntax, collections, modules, and asynchronous programming.</p>
  </header>
  <main class="workspace">
    <section class="programs">
      <p class="section-label">Choose an exercise</p>
      <div class="buttons">
    <button data-file="1-student-management.js">1. Student Management</button>
    <button data-file="2-promise-async.js">2. Promise and Async/Await</button>
    <button data-file="3-array-processing.js">3. Array Processing</button>
    <button data-file="4-spread-rest-default.js">4. Spread, Rest and Default</button>
    <button data-file="5-app.js">5. Module Application</button>
    <button data-file="6-attendance.js">6. Map and Set Attendance</button>
    <button data-file="7-this-arrow-analysis.js">7. This and Arrow Function</button>
    <button data-file="8-comprehensive-data-processing.js">8. Comprehensive Processing</button>
      </div>
    </section>
    <section class="result-panel">
      <div class="result-heading"><span>Live output</span><span class="status-dot"></span></div>
      <pre id="output">Choose a program above.</pre>
    </section>
  </main>

  <script type="module">
    const output = document.querySelector("#output");

    for (const button of document.querySelectorAll("button")) {
      button.addEventListener("click", async () => {
        output.textContent = `Running ${button.dataset.file}...`;
        const originalLog = console.log;
        const originalError = console.error;
        const lines = [];
        console.log = (...values) => lines.push(values.join(" "));
        console.error = (...values) => lines.push(values.join(" "));

        try {
          await import(`./${button.dataset.file}?run=${Date.now()}`);
          output.textContent = lines.join("\n") || "Program completed without output.";
        } catch (error) {
          output.textContent = `Error: ${error.message}`;
        } finally {
          console.log = originalLog;
          console.error = originalError;
        }
      });
    }
  </script>
</body>
</html>
